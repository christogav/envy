name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    # macOS only: envy links the Keychain frameworks, and the end-to-end
    # tests drive a real zsh.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The real-Keychain test stays #[ignore]d: runners have no unlocked
      # login keychain.
      - run: cargo test
