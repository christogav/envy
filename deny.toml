# cargo-deny policy; run in CI by .github/workflows/deny.yml.

[graph]
# envy is macOS only, so only check what is built for macOS.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
# Known vulnerabilities and yanked crates fail the check; unmaintained crates
# in the dependency tree warn.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# envy is MIT. Only permissive licences are allowed in its dependency tree.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
